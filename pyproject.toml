[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "terrarium-sim"
version = "0.1.0"
description = "A terminal-first closed terrarium ecosystem simulation game."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
bundle = ["build>=1.2", "pyinstaller>=6.0"]

[project.scripts]
terrarium = "terrarium.cli:main"

[tool.setuptools.packages.find]
include = ["terrarium*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
