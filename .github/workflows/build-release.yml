name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version or label for artifact names"
        required: false
        default: "dev"
      release_tag:
        description: "Optional existing GitHub release tag to attach packages to"
        required: false
        default: ""
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-latest
            platform: macos-arm64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install bundle dependencies
        run: python -m pip install --upgrade pip ".[bundle]"

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Resolve package version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "value=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            echo "value=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: python scripts/build-release.py --version "${{ steps.version.outputs.value }}" --platform-label "${{ matrix.platform }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: terrarium-sim-${{ steps.version.outputs.value }}-${{ matrix.platform }}
          path: dist/release/*.zip
          if-no-files-found: error

      - name: Attach package to GitHub release
        if: github.event_name == 'release' || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.version.outputs.value }}" dist/release/*.zip --clobber
